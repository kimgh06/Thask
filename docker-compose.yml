services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: thask
      POSTGRES_USER: thask
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thask_password}
    ports:
      - "7242:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thask"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "7244:7244"
    environment:
      DATABASE_URL: postgresql://thask:${POSTGRES_PASSWORD:-thask_password}@postgres:5432/thask
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
      PORT: "7244"
      FRONTEND_URL: ${APP_URL:-http://localhost:7243}
      CAPTURE_URL: http://capture:7241
      CAPTURE_INTERNAL_SECRET: ${CAPTURE_INTERNAL_SECRET:-}
      # v0.6.0 B-2: local filesystem attachment storage. Point at the mounted
      # named volume so uploads survive backend restarts. MinIO/S3 swap-in
      # keeps this env var (as the S3 prefix) so no callers change.
      THASK_ATTACHMENT_DIR: /data/attachments
      THASK_ATTACHMENT_MAX_BYTES: ${THASK_ATTACHMENT_MAX_BYTES:-10485760}
    volumes:
      - thask-attachments:/data/attachments
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7244/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  capture:
    build:
      context: ./capture
      dockerfile: Dockerfile
    expose:
      - "7241"
    environment:
      PORT: "7241"
      FRONTEND_URL: ${CAPTURE_FRONTEND_URL:-http://frontend:7243}
      BROWSER_WS_ENDPOINT: ws://browserless:3000
      CAPTURE_INTERNAL_SECRET: ${CAPTURE_INTERNAL_SECRET:-}
    depends_on:
      frontend:
        condition: service_healthy
      browserless:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:7241/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  browserless:
    image: browserless/chrome:latest
    environment:
      PORT: "3000"
      CONNECTION_TIMEOUT: "60000"
    expose:
      - "3000"
    shm_size: "1gb"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "7243:7243"
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:7244}
      ORIGIN: ${APP_URL:-http://localhost:7243}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:7243/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
  thask-attachments:
