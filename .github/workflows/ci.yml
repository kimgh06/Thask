name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum
      - name: Run tests
        working-directory: backend
        run: go test ./... -v

  cli:
    name: CLI Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: cli/go.sum
      - name: Run tests
        working-directory: cli
        run: go test ./... -v

  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Type check
        working-directory: frontend
        run: npm run check

  frontend-e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: thask
          POSTGRES_PASSWORD: thask_ci_password
          POSTGRES_DB: thask
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      # Build and start backend
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum
      - name: Build backend
        working-directory: backend
        run: go build -o server ./cmd/server
      - name: Start backend
        working-directory: backend
        run: ./server &
        env:
          DATABASE_URL: postgresql://thask:thask_ci_password@localhost:5432/thask
          SESSION_SECRET: ci-test-secret-64-chars-long-enough-for-testing-purposes-here123
          FRONTEND_URL: http://localhost:7243
          PORT: '7244'

      # Build and test frontend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps
      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:7244/health && break
            sleep 1
          done
      - name: Run E2E tests
        working-directory: frontend
        run: npx playwright test
        env:
          BACKEND_URL: http://localhost:7244
